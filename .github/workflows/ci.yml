name: Cleaner — build and tests

# Every pull request and every push: build with swiftc, then the two tests that run on the
# machine itself (the self-test only reads; the uninstall test fakes an app and cleans up).
# No secrets here, so it is safe for pull requests from forks. The build is signed ad hoc.

on:
    pull_request:
    push:
        branches: [main]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: macos-15
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - name: Newest Xcode
              run: |
                  XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
                  sudo xcode-select -s "$XCODE"
                  xcrun --show-sdk-version
                  swiftc --version | head -1

            - name: Build
              run: bash scripts/build.sh

            - name: Self-test
              run: CLEANER_NO_ADMIN=1 dist/Cleaner.app/Contents/MacOS/Cleaner --selftest

            - name: Uninstall test
              run: dist/Cleaner.app/Contents/MacOS/Cleaner --uninstall-test
